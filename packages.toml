# Packages of the base: every ilex image has them, with or without a shell.
# Keep it small: fedora-bootc plus ilex's own files. `cargo xtask build --shell
# none` enforces a budget of 128 MiB over fedora-bootc (see CLAUDE.md).
# Tables as in shells/packages.toml:
#   install = packages and @groups to install
#   exclude = packages kept out even when a group pulls them in (dnf --exclude)

[tools]
# drupe mounts signed tool images with systemd-dissect, also without a shell.
install = ["systemd-container"]
# Keep out systemd-container's three QEMU recommendations: drupe needs only
# the signed-image tools. Do not exclude fedora-bootc's qemu-user-static packages.
# Shells and machines may install these VM packages in their own transactions.
exclude = ["qemu-kvm-core", "qemu-device-display-virtio-gpu", "qemu-device-display-virtio-vga"]
