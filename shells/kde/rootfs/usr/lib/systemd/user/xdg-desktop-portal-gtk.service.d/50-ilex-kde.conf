[Unit]
# Plasma's GTK look lives in a KDE-only GSettings database that only this portal
# reads. The portal is also part of graphical-session.target, but it must stop
# whenever Plasma's own target does, so that no portal reading that database is
# left in a user manager that outlives the session (a lingering one, or a crash)
# for a GNOME login to meet.
PartOf=plasma-workspace.target

[Service]
# The wrapper picks the KDE database only for a Plasma session, per start.
ExecStart=
ExecStart=/usr/libexec/ilex/portal-gtk
