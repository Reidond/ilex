name = "gnome"
description = "GNOME on Wayland, signed in through GDM"

[packages]
# Previously a weak dependency of systemd-container, now installed in the
# base without QEMU. Keep GNOME's existing VM package set unchanged.
install = ["@gnome-desktop", "gdm", "qemu-kvm-core"]

[session]
# The session file in /usr/share/wayland-sessions, without .desktop.
desktop = "gnome"
compositor = "gnome-shell"

[greeter]
unit = "gdm.service"

[theme]
# GNOME draws itself with Adwaita and reads no design system outputs.
targets = []
