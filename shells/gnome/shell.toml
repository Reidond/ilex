name = "gnome"
description = "GNOME on Wayland, signed in through GDM"

[packages]
# Public profile settings confine the session's dconf writer.
install = ["@gnome-desktop", "gdm", "bubblewrap"]

[session]
# The session file in /usr/share/wayland-sessions, without .desktop.
desktop = "gnome"
compositor = "gnome-shell"

[greeter]
unit = "gdm.service"
