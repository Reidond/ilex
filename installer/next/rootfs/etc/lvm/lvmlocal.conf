# The installer's live system never activates what an earlier installation left
# on a disk. An LVM volume group or an MD array that came up by itself would
# hold its disk (the helper refuses a disk the running system uses) and leave
# the person no way to choose it; a disk the installer overwrites should be
# there to overwrite. The kernel command line of every boot entry says the same
# to the initramfs (`rd.lvm=0 rd.md=0`); this file covers what udev starts once
# the system is up. Nothing is hidden: `vgchange -ay` still works by hand.
global {
	event_activation = 0
}
activation {
	auto_activation_volume_list = []
}
