<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  Only root and the installer's own user may own or call the helper. The
  installer's unprivileged session runs as ilex-installer; everyone else,
  including a user who logs in on tty2, is refused by the bus.
-->
<busconfig>
  <policy user="root">
    <allow own="org.ilex.Installer1"/>
    <allow send_destination="org.ilex.Installer1"/>
  </policy>
  <policy user="ilex-installer">
    <allow send_destination="org.ilex.Installer1"/>
  </policy>
  <policy context="default">
    <deny own="org.ilex.Installer1"/>
    <deny send_destination="org.ilex.Installer1"/>
  </policy>
</busconfig>
