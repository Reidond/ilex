<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  Root owns the name and may call it; the installer's unprivileged session
  runs as ilex-installer and only calls it. Everyone else is refused by the
  bus, including a user who logs in on a console. (The shell on tty2 is a root
  autologin, so it is allowed, as root is; it is the one other way in, for
  whoever has the keyboard of the installer.)
-->
<busconfig>
  <policy user="root">
    <allow own="org.ilex.Installer1"/>
    <allow send_destination="org.ilex.Installer1"/>
  </policy>
  <policy user="ilex-installer">
    <allow send_destination="org.ilex.Installer1"/>
  </policy>
  <policy context="default">
    <deny own="org.ilex.Installer1"/>
    <deny send_destination="org.ilex.Installer1"/>
  </policy>
</busconfig>
