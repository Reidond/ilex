# The installer medium runs no SSH server on a real boot: fedora-bootc enables
# sshd, but a person who boots this ISO has no key on it and no reason for an
# open port. The test harness supplies its key as the SMBIOS credential
# ssh.authorized_keys.root (systemd provisions /root/.ssh/authorized_keys from
# it), and only then does sshd start, for the harness's diagnostics and
# checks.
[Unit]
ConditionCredential=ssh.authorized_keys.root
