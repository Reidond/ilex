# The installer medium runs no SSH server on a real boot: fedora-bootc enables
# sshd, but a person who boots this ISO has no key on it and no reason for an
# open port. sshd starts only once something has provisioned root's
# authorized_keys before it: the test harness's SMBIOS credential
# ssh.authorized_keys.root (systemd-tmpfiles writes the file from it), or the
# `tmpfiles.extra` credential bcvk passes its key in (`f+~
# /root/.ssh/authorized_keys`), which is not that credential. Testing the file
# rather than either credential admits both and nothing else.
[Unit]
ConditionFileNotEmpty=/root/.ssh/authorized_keys
