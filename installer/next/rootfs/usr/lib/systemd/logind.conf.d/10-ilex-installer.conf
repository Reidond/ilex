# An installation must not be interrupted by the machine going to sleep or
# the screen locking: nothing here acts on idle time, lids or sleep keys.
[Login]
ReserveVT=2
IdleAction=ignore
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
HandlePowerKey=ignore
HandleSuspendKey=ignore
HandleHibernateKey=ignore
