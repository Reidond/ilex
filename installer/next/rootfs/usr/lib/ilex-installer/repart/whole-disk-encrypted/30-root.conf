# The same root, inside a LUKS2 volume. This directory is the whole layout of
# an encrypted installation (the ESP and /boot files repeat whole-disk's; the
# helper's self-check keeps them identical), so systemd-repart is pointed at
# exactly one directory and never sees two root partitions. The key is passed
# to repart with --key-file, never written here.
[Partition]
Type=root
Label=ilex-root
Format=btrfs
Encrypt=key-file
SizeMinBytes=30G
