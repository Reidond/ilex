# /boot beside other systems: an XBOOTLDR partition, as whole-disk's, in
# unallocated space (systemd-repart takes the smallest free area that holds it).
# The sizes are the model's BOOT_BYTES. There is no ESP definition: the disk's
# own EFI system partition is shared and never touched by repart.
[Partition]
Type=xbootldr
Label=ilex-boot
Format=ext4
SizeMinBytes=1G
SizeMaxBytes=1G
