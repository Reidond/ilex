# The same root as free-space/30-root.conf, inside a LUKS2 volume. This
# directory is the whole layout of an encrypted installation beside other
# systems (the /boot file repeats free-space's; the helper's self-check keeps
# them identical), so systemd-repart is pointed at exactly one directory and
# never sees two root partitions. The key is passed to repart with --key-file,
# never written here.
[Partition]
Type=root
Label=ilex-root
Format=btrfs
Encrypt=key-file
SizeMinBytes=30G
