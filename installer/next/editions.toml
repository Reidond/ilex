# The live installer's editions. One ISO per edition, as Fedora ships Silverblue
# (GNOME) and Kinoite (KDE). The identifier names the image stage, its files
# (`editions/<id>/`) and the ISO; the display name is what a person reads, and
# this file is the only place it lives, so it can change without touching code.
# The owner chose ilex Glabra for the GNOME edition and ilex Kingiana for the
# KDE edition (both holly species); the identifier stays the shell's name.

[gnome]
display-name = "ilex Glabra"

[kde]
display-name = "ilex Kingiana"
