[package]
name = "ilexctl"
description = "The ilex machine and development command line"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["dev"]
# The image always disables checkout tooling.
dev = ["clap/string", "dep:anyhow", "dep:ilex-devkit", "dep:ilex-vmctl", "dep:xtask"]

[dependencies]
clap.workspace = true
clap_complete = "4"
ilex-agent = { path = "../ilex-agent" }
anyhow = { workspace = true, optional = true }
ilex-devkit = { workspace = true, optional = true }
ilex-vmctl = { path = "../ilex-vmctl", optional = true }
xtask = { path = "../xtask", optional = true }
