# Public profile data shipped in every composition, without a user OCI tag.
users = ["reidond"]

# The default composition: what `cargo xtask build`, `test`, `vm` and `disk`
# use with no flags. It is the base + these shells + machine `generic`.
shells = ["gnome"]
default-shell = "gnome"

# Design systems, installed in every composition that has a shell.
# The base has none.
design-systems = ["ilex"]
default-design-system = "ilex"

# The installer's default composition: what the ISO installs on a computer no
# machine configuration matches. Its shell list is the one the installer gives
# a machine it recognises (<machine>.<these shells>). Also what the upgrade
# tier tests. One of the generic.<shells> tags below.
installer = "generic.gnome"

# What CI publishes to ghcr.io/reidond/ilex besides the base (`:base`, always).
# One entry per shell list, one image per machine in it. The tag is
# <machine>.<shell>[.<shell>...], shells in order; the first is the default
# shell. `shells = []` publishes machines on the bare base as `:<machine>`.
[[publish]]
shells = ["gnome"]
machines = ["generic", "ms-7c35"]
