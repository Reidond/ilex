name: Upload scanned qualification evidence
description: Verify the privacy scan seal before uploading qualification artifacts
inputs:
  name:
    description: Artifact name
    required: true
  encrypted:
    description: Sealed scope (false for firmware, true for the full suite, lifecycle for an isolated run, release for the installer gate)
    required: true
runs:
  using: composite
  steps:
    - name: Verify the scan seal
      id: verify
      shell: bash
      env:
        HAS_ENCRYPTED_EVIDENCE: ${{ inputs.encrypted }}
        ARTIFACT_NAME: ${{ inputs.name }}
      run: |
        python3 -B crates/ilex-e2e/src/encrypted/privacy.py "$RUNNER_TEMP/security-artifacts" --check-seal "$RUNNER_TEMP/qualification-evidence.seal" "$HAS_ENCRYPTED_EVIDENCE" "$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
    - uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.name }}
        path: ${{ steps.verify.outputs.paths }}
        if-no-files-found: error
        retention-days: 3
