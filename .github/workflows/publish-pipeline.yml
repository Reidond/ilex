# Build, test, publish and sign the ilex image; and, now and then, build the
# installer ISO.
#
# Runs on every merge to main, nightly at 03:00 UTC (the base image floats, so
# the nightly picks up its updates) and on demand. It publishes only when the
# image content changed (`cargo ilexctl changed`) and the e2e tests pass. A run
# with an unchanged generic image skips its rechunk and base tests; machines
# still check their inputs and published base identity below.
#
# Every root of `info --publications` has its own jobs on its own runner, so the
# slow parts overlap and a failing root cannot block another one:
#
# * build: the installer root (:generic.gnome): build → changed → rechunk →
#   stage the unsigned candidate in ghcr → the ephemeral tier (and the opt-in
#   security/encrypted/apps tiers);
# * upgrade: restores the upgrade tier's v1 (the published :generic.gnome), already
#   installed to a disk, from the Actions cache (or installs it, ~14 minutes),
#   waits for the build job to stage the candidate, pulls it by digest and
#   runs the upgrade tier;
# * other-roots: one publish-root.yml call per remaining root (`base`, a second
#   desktop...), in parallel, never failing fast: that root's build, changed,
#   rechunk, stage, ephemeral tier, then its own signing and its own layers.
#   Its signing and layers (only those) also wait for this file's `build` job
#   (the security tier) and `upgrade` job to have succeeded: they exercise the
#   boot chain and the update path every root shares. Nothing here waits for
#   any other root;
# * installer-due → iso: see below.
#
# Then publish signs the installer root's staged digest, the one both tiers
# tested, and moves :generic.gnome to it; nothing is pushed twice. Main stages as
# `:candidate.<tag>` in the `publish` group. Other refs have their own groups
# and staging tags.
# Then machines builds/tests the installer root's opted-in layers on that digest
# (or current :generic.gnome by digest when unchanged); only main signs/publishes
# machine tags. The installer-release job needs only build, upgrade, publish and
# iso: no other root can hold it back.
#
# After a publish, the publish job starts this workflow again with `v1_disk`:
# that run (the v1-disk job alone, in a concurrency group of its own, so
# nothing waits for it) installs the new :generic.gnome to a disk and puts it in the
# Actions cache for the next run's upgrade tier.
#
# The installer ISO is a network installer: it carries no ilex image and installs
# the newest :generic.gnome from ghcr, so it needn't follow every publish. It is built
# (and, on main, released as a GitHub Release) when `cargo ilexctl iso --due` says
# so: no installer release yet, `installer/` (or the ISO code for ilexctl) changed
# since the latest one, or the latest one is a week old (Fedora and Anaconda
# fixes). A manual run with `iso` checked builds it regardless.
#
# Runner: `vars.ILEX_RUNNER` (repository variable) or ubuntu-26.04. One
# setting moves every job to a larger or self-hosted runner.
#
# One-time repository setup (secrets, the public ghcr package) is in CLAUDE.md.
name: publish pipeline

on:
  workflow_call:
    secrets:
      COSIGN_PRIVATE_KEY:
        required: false
      COSIGN_PASSWORD:
        required: false
    inputs:
      iso:
        description: Build the installer ISO even if it isn't due (on main it is released; from a branch it is kept as an artifact)
        type: boolean
        default: false
      test:
        description: Run the e2e tests even if the image is unchanged (to check CI changes from a branch; only main publishes)
        type: boolean
        default: false
      apps:
        description: Run the opt-in installed-system Flatpak qualification (downloads from Flathub)
        type: boolean
        default: false
      v1_disk:
        description: Only install the published installer composition to a disk for the upgrade tier's cache (the publish job starts this after each publish)
        type: boolean
        default: false
      encrypted_install:
        description: Qualify encrypted installation, recovery, privacy, and a real kernel upgrade and rollback (6 GiB)
        type: boolean
        default: false
      encrypted_upgrade_from:
        description: Signed rollback image pinned by digest
        type: string
      encrypted_update_kernel:
        description: Optional exact Fedora kernel for the disposable encrypted CI update image
        type: string
      encrypted_lifecycle_only:
        description: Run the encrypted lifecycle by itself for a focused qualification
        type: boolean
        default: false

      main:
        type: boolean
        required: true

permissions:
  contents: read
  packages: write
  # The upgrade job reads the build job's progress from the jobs API.
  actions: read

env:
  CARGO_TERM_COLOR: always
  # cosign v2 on purpose: bootc / containers-image verify the legacy `.sig`
  # tag format, which cosign v3 no longer writes by default.
  COSIGN_VERSION: v2.6.5
  BCVK_VERSION: v0.22.0
  BCVK_SHA256: eb72198c0d36fab75bfcadbb6794a87afa6f496a4da6b1b34d27728243fa6474
  # Ubuntu's packages for the VM stack in the Actions cache (vm-prep.sh): the
  # newest entry with this prefix is restored; a job that downloaded packages
  # it lacked saves the set under this prefix and a hash of their names.
  # v2 includes the ISO tier's host tools (not just the bcvk VM stack).
  APT_DEBS: apt-debs-${{ vars.ILEX_RUNNER || 'ubuntu-26.04' }}-v2-

jobs:
  snapshot:
    if: ${{ !inputs.v1_disk }}
    runs-on: ${{ vars.ILEX_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    outputs:
      installer: ${{ steps.registry.outputs.installer }}
      compositions: ${{ steps.registry.outputs.compositions }}
      legacy: ${{ steps.registry.outputs.legacy }}
      # The tags of every root except the installer's: a JSON array, one
      # publish-root.yml call each.
      others: ${{ steps.registry.outputs.others }}
      # Fedora's two floating build images, resolved once for every root of
      # this run (fedora-pins.sh): each root pulls these digests, never the tag.
      fedora_bootc: ${{ steps.fedora.outputs.bootc }}
      fedora_builder: ${{ steps.fedora.outputs.builder }}
      # This file's pins for those calls (a call's `with` cannot read `env`).
      cosign_version: ${{ env.COSIGN_VERSION }}
      bcvk_version: ${{ env.BCVK_VERSION }}
      bcvk_sha256: ${{ env.BCVK_SHA256 }}
      apt_debs: ${{ env.APT_DEBS }}
    steps:
      - uses: actions/checkout@v7
      - name: Snapshot published composition digests
        id: registry
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ilex"
          command -v skopeo >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y skopeo; }
          podman login --username "$GITHUB_ACTOR" --password-stdin ghcr.io <<<"$REGISTRY_TOKEN"
          installer=$(cargo ilexctl info --installer)
          cargo ilexctl info --publications > "$RUNNER_TEMP/publications"
          compositions='{}'
          legacy=-
          while IFS=$'\t' read -r tag kind _; do
            bash .github/publication-tag.sh "$tag"
            digest=$(bash .github/publish-head.sh digest "$repo:$tag")
            compositions=$(jq -c --arg tag "$tag" --arg digest "$digest" '.[$tag] = $digest' <<<"$compositions")
            echo "snapshot: $repo:$tag = $digest"
          done < "$RUNNER_TEMP/publications"
          if jq -e 'any(.[]; . == "-")' <<<"$compositions" >/dev/null; then
            legacy=$(bash .github/publish-head.sh digest "$repo:latest")
          fi
          # `base` is always published, so this is never empty (an empty
          # matrix would fail the workflow with an unrelated message).
          others=$(awk -F '\t' -v tag="$installer" '$2 == "root" && $1 != tag {print $1}' "$RUNNER_TEMP/publications" |
            jq -R -s -c 'split("\n") | map(select(length > 0))')
          jq -e 'length > 0' <<<"$others" >/dev/null
          echo "roots besides the installer's $installer: $others"
          printf 'installer=%s\ncompositions=%s\nlegacy=%s\nothers=%s\n' "$installer" "$compositions" "$legacy" "$others" >> "$GITHUB_OUTPUT"

      # `fedora-bootc:45` and `fedora:45` float. Every root builds from the
      # digests resolved here, once: an upstream push between two roots' pulls
      # could otherwise leave the installer root unchanged (its tiers skipped,
      # the qualification gate true) while another root builds and signs a new,
      # untested boot chain. A partial re-run reuses this job's outputs, so the
      # pins also hold across attempts.
      - name: Pin Fedora's floating build images
        id: fedora
        run: bash .github/fedora-pins.sh resolve >> "$GITHUB_OUTPUT"

  build:
    # 26.04, not 24.04: its podman 5.7 / buildah 1.42 / skopeo 1.21 are close
    # to the Fedora 45 dev box; 24.04's podman 4.9 rejects Containerfile
    # syntax the dev box accepts.
    needs: snapshot
    if: ${{ !cancelled() && (needs.snapshot.result == 'success' || (inputs.v1_disk && inputs.encrypted_install)) }}
    runs-on: ${{ vars.ILEX_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: ${{ inputs.encrypted_install && 360 || 120 }}
    outputs:
      installer_changed: ${{ steps.changed.outputs.changed || 'false' }}
      # The installer root's validated one-row inventory (root-evidence.sh).
      roots: ${{ steps.roots.outputs.roots }}
      # What `cargo ilexctl publish --stage --as` pushed for the installer root.
      digest: ${{ steps.stage.outputs.digest }}
      tag: ${{ steps.composition.outputs.tag }}
      snapshot: ${{ steps.composition.outputs.snapshot }}
      fingerprint: ${{ steps.stage.outputs.fingerprint }}
    env:
      # `cargo ilexctl build --tag candidate` tags the image localhost/ilex:candidate.
      # The image as built; `cargo ilexctl rechunk --output rechunked` makes the image
      # that is tested and published when it changed.
      ILEX_IMAGE: localhost/ilex:candidate
    steps:
      - name: Reject incompatible encrypted qualification inputs
        if: inputs.encrypted_install && inputs.v1_disk
        run: |
          echo '::error::encrypted_install requires the build/qualification job; v1_disk is a separate cache-only run.'
          exit 1
      - name: Reject a lifecycle-only run without encrypted qualification
        if: inputs.encrypted_lifecycle_only && !inputs.encrypted_install
        run: |
          echo '::error::encrypted_lifecycle_only requires encrypted_install=true.'
          exit 1
      - uses: actions/checkout@v7

      - name: Registry names and installer composition
        id: composition
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INSTALLER_TAG: ${{ needs.snapshot.outputs.installer }}
          SNAPSHOTS: ${{ needs.snapshot.outputs.compositions }}
          LEGACY_DIGEST: ${{ needs.snapshot.outputs.legacy }}
          FEDORA_BOOTC: ${{ needs.snapshot.outputs.fedora_bootc }}
          FEDORA_BUILDER: ${{ needs.snapshot.outputs.fedora_builder }}
        run: |
          IMAGE_REPO="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ilex"
          echo "IMAGE_REPO=$IMAGE_REPO" >> "$GITHUB_ENV"
          tag=$INSTALLER_TAG
          bash .github/publication-tag.sh "$tag"
          echo "INSTALLER_TAG=$tag" >> "$GITHUB_ENV"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          cargo ilexctl info --publications > "$RUNNER_TEMP/publications"
          shells=$(awk -F '\t' -v tag="$tag" '$1 == tag && $2 == "root" {print $5}' "$RUNNER_TEMP/publications")
          test -n "$shells"
          echo "ILEX_SHELLS=$shells" >> "$GITHUB_ENV"
          # `changed` needs skopeo before the VM stack is installed.
          command -v skopeo >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y skopeo; }
          podman login --username "$GITHUB_ACTOR" --password-stdin ghcr.io <<<"$REGISTRY_TOKEN"
          snapshot=$(jq -er --arg tag "$tag" '.[$tag]' <<<"$SNAPSHOTS")
          echo "snapshot=$snapshot" >> "$GITHUB_OUTPUT"
          # Only this root's current digest: the other roots pull their own on
          # their own runners.
          digest=$snapshot
          if [ "$digest" = - ]; then digest=$LEGACY_DIGEST; fi
          printf '%s\t%s\n' "$tag" "$digest" > "$RUNNER_TEMP/root-pulls"
          echo "ILEX_ROOT_PULLS=$RUNNER_TEMP/root-pulls" >> "$GITHUB_ENV"
          # Both floating inputs at the digests `snapshot` pinned for every root
          # of this run (tagged :45 locally; the build below uses --no-pull).
          # Their digests plus the selected source trees permit an early
          # no-build skip.
          bash .github/fedora-pins.sh pull "$FEDORA_BOOTC" "$FEDORA_BUILDER"
          reference=-
          if [ "$snapshot" != - ]; then reference="$IMAGE_REPO@$snapshot"; fi
          cargo ilexctl changed "$reference" --root "$tag" --inputs-only
          # The apps check below covers only what this root ships: its shells
          # (ILEX_SHELLS above) and the machines of its layers.
          machines=$(awk -F '\t' -v tag="$tag" '$2 == "layer" && $3 == tag {print $4}' "$RUNNER_TEMP/publications" | paste -s -d, -)
          echo "ILEX_APPS_MACHINES=${machines:-none}" >> "$GITHUB_ENV"

      # This root's own shells and layer machines, as every other root checks
      # its own (publish-root.yml): another root's broken ID cannot block it.
      - name: Check this root's configured Flathub apps (metadata only)
        timeout-minutes: 10
        run: cargo ilexctl doctor apps

      # The runner's root disk is 145 GB with about 110 GB free: container
      # storage for the build, the rechunk and the test VM fits without
      # deleting the preinstalled toolchains first.
      - name: Disk
        run: df -h / /mnt

      # Nothing below starts when this root's inputs are unchanged and no
      # forced/qualification run selects it: every later step is skipped then.
      - uses: kunobi-ninja/kache-action@v1
        if: steps.composition.outputs.inputs_changed == 'true' || inputs.test || inputs.apps || inputs.encrypted_install
        with:
          github-cache: "true"

      # In the background while the image builds: the VM stack for the
      # ephemeral tier, and a pull of :generic.gnome. The pull records which
      # compressed blob in the registry holds each of its layers, so staging
      # the candidate (reproducible layers, mostly the same) uploads only what
      # changed and machines download only that. A run that changed nothing
      # never waits for either; the end of the job stops them.
      - name: apt's packages from the cache
        id: debs
        if: steps.composition.outputs.inputs_changed == 'true' || inputs.test || inputs.apps || inputs.encrypted_install
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/apt-debs
          key: ${{ env.APT_DEBS }}
          restore-keys: ${{ env.APT_DEBS }}

      - name: VM stack and :generic.gnome (background)
        if: steps.composition.outputs.inputs_changed == 'true' || inputs.test || inputs.apps || inputs.encrypted_install
        run: nohup bash .github/vm-prep.sh ephemeral > /dev/null 2>&1 &

      - name: Build the candidate image
        if: steps.composition.outputs.inputs_changed == 'true' || inputs.test || inputs.apps || inputs.encrypted_install
        run: cargo ilexctl build --tag candidate --no-pull

      # Fingerprints the image as built (the rechunk keeps it): when it is the
      # published one, everything below is skipped.
      - name: Compare with the published image
        id: changed
        if: steps.composition.outputs.inputs_changed == 'true' || inputs.test || inputs.apps || inputs.encrypted_install
        run: |
          reference=-
          if [ "$SNAPSHOT" != - ]; then reference="$IMAGE_REPO@$SNAPSHOT"; fi
          cargo ilexctl changed "$reference" --image candidate
        env:
          SNAPSHOT: ${{ steps.composition.outputs.snapshot }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Reproducible layers, into the tag `rechunked`: the image the tests run
      # on and publish signs. (Rechunking while the tests run on the image as
      # built was tried: the upgrade tier then builds its v2 from layers that
      # share nothing with the published v1 and the VM boots v1 again after the
      # reboot. See CLAUDE.md.) A forced test run (`test`) of an unchanged
      # image is rechunked too, for the same reason.
      - name: Rechunk (reproducible layers)
        if: steps.changed.outputs.changed == 'true' || inputs.test || inputs.apps || inputs.encrypted_install
        run: cargo ilexctl rechunk candidate --output rechunked --fingerprint "$FINGERPRINT"
        env:
          FINGERPRINT: ${{ steps.changed.outputs.fingerprint }}

      - name: Wait for :generic.gnome
        if: ${{ !inputs.encrypted_install && (steps.changed.outputs.changed == 'true' || inputs.test || inputs.apps) }}
        timeout-minutes: 15
        run: .github/vm-prep.sh wait "root-pull.$INSTALLER_TAG"

      # The upgrade job waits for this step (by name) and pulls the digest.
      # Unsigned, never :generic.gnome: a branch run stages too, so its upgrade tier
      # can run, but only main publishes. Encrypted qualification uses the same
      # local image ID and supplies the installer through its own loopback registry.
      - name: Stage the candidate
        id: stage
        if: steps.changed.outputs.changed == 'true' || inputs.test || inputs.apps || inputs.encrypted_install
        run: |
          image_id=$(podman image inspect --format '{{.Id}}' localhost/ilex:rechunked)
          image_id="sha256:${image_id#sha256:}"
          if [[ "$ENCRYPTED_INSTALL" != true ]]; then
            stage_tag=$(bash .github/candidate-tag.sh "$INSTALLER_TAG")
            cargo ilexctl publish "$image_id" --stage --as "$INSTALLER_TAG" \
              --stage-tag "$stage_tag" --stage-snapshot "$SNAPSHOT"
          fi
          echo "image_id=$image_id" >> "$GITHUB_OUTPUT"
        env:
          ENCRYPTED_INSTALL: ${{ inputs.encrypted_install }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SNAPSHOT: ${{ steps.composition.outputs.snapshot }}

      - name: Wait for the VM stack
        id: stack
        if: steps.changed.outputs.changed == 'true' || inputs.test || inputs.apps || inputs.encrypted_install
        timeout-minutes: 15
        run: |
          .github/vm-prep.sh wait vm-stack
          echo "debs=$APT_DEBS$(cat "$RUNNER_TEMP/apt-debs.sum")" >> "$GITHUB_OUTPUT"

      # Only when apt downloaded packages the cache lacked. (The upgrade job
      # installs the same set and leaves saving it to this job.)
      - name: Keep apt's packages in the cache
        if: steps.stack.outputs.debs != '' && steps.stack.outputs.debs != steps.debs.outputs.cache-matched-key
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/apt-debs
          key: ${{ steps.stack.outputs.debs }}

      - name: e2e tests (ephemeral)
        if: ${{ !inputs.encrypted_lifecycle_only && (steps.changed.outputs.changed == 'true' || inputs.test || inputs.apps || inputs.encrypted_install) }}
        env:
          # Always the rechunked image: the one staged above.
          ILEX_IMAGE: ${{ steps.stage.outputs.image_id }}
        run: |
          podman run --rm -i --network=none --entrypoint python3 "$ILEX_IMAGE" -I -S - < .github/check-filecaps.py
          sg libvirt -c 'cargo ilexctl test ephemeral::'

      - name: Qualify candidate secure firmware and persistent TPM
        id: security-qualification
        if: steps.changed.outputs.changed == 'true' || inputs.test || inputs.encrypted_install
        env:
          ILEX_IMAGE: ${{ steps.stage.outputs.image_id }}
          ILEX_SECURITY_MEMORY: ${{ inputs.encrypted_install && '6G' || '4G' }}
        run: bash .github/security-tier.sh

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        if: inputs.encrypted_install
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Select and verify the encrypted rollback baseline
        id: encrypted-baseline
        if: inputs.encrypted_install
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          INSTALLER_BASELINE_SNAPSHOT: ${{ steps.composition.outputs.snapshot }}
          INSTALLER_BASELINE_TARGET: ${{ steps.changed.outputs.changed == 'false' && inputs.encrypted_update_kernel == '' && steps.composition.outputs.snapshot || '' }}
          ILEX_ENCRYPTED_UPGRADE_FROM: ${{ inputs.encrypted_upgrade_from || vars.ILEX_ENCRYPTED_UPGRADE_FROM }}
          ILEX_ARTIFACTS: ${{ runner.temp }}/security-artifacts
        run: bash .github/encrypted-baseline.sh

      - name: Build exact ISO for encrypted candidate gate
        if: inputs.encrypted_install
        timeout-minutes: 40
        run: bash .github/encrypted-iso.sh

      - name: Exact encrypted installer qualification
        if: inputs.encrypted_install && !inputs.encrypted_lifecycle_only
        timeout-minutes: 180
        env:
          ILEX_IMAGE: ${{ steps.stage.outputs.image_id }}
        run: bash .github/encrypted-tier.sh

      - name: Prepare private lifecycle evidence
        if: inputs.encrypted_install && inputs.encrypted_lifecycle_only
        run: |
          private=$(mktemp -d "$RUNNER_TEMP/ilex-fingerprints.XXXXXXXX")
          echo "ILEX_PRIVATE_FINGERPRINTS=$private" >> "$GITHUB_ENV"

      - name: Qualify encrypted upgrade and rollback
        if: inputs.encrypted_install && steps.encrypted-baseline.outputs.reference != ''
        timeout-minutes: 115
        env:
          ILEX_IMAGE: ${{ steps.stage.outputs.image_id }}
          ILEX_ARTIFACTS: ${{ runner.temp }}/security-artifacts
          ILEX_ENCRYPTED_UPGRADE_FROM: ${{ steps.encrypted-baseline.outputs.reference }}
          ILEX_ENCRYPTED_UPDATE_KERNEL: ${{ inputs.encrypted_update_kernel }}
        run: bash .github/encrypted-lifecycle.sh

      - name: Qualify a fresh encrypted install when no rollback image exists
        if: inputs.encrypted_install && inputs.encrypted_lifecycle_only && steps.encrypted-baseline.outputs.reference == ''
        timeout-minutes: 85
        env:
          ILEX_IMAGE: ${{ steps.stage.outputs.image_id }}
          ILEX_ARTIFACTS: ${{ runner.temp }}/security-artifacts
        run: timeout --signal=TERM --kill-after=30s 80m cargo ilexctl test security::encrypted_install -- --exact --test-threads 1

      - name: Report unchanged security tier as unqualified
        if: steps.changed.outputs.changed != 'true' && !inputs.test && !inputs.encrypted_install
        run: echo 'security::firmware **UNQUALIFIED** (unchanged image; tier not run). Use test=true to qualify this runner.' >> "$GITHUB_STEP_SUMMARY"

      - name: Scan and seal qualification evidence
        if: steps.security-qualification.outcome == 'success'
        id: qualification-scan
        env:
          ENCRYPTED_INSTALL: ${{ inputs.encrypted_install }}
          LIFECYCLE_ONLY: ${{ inputs.encrypted_lifecycle_only }}
          BASELINE: ${{ steps.encrypted-baseline.outputs.reference }}
        run: |
          scope=false
          if [[ "$ENCRYPTED_INSTALL" == true ]]; then
            if [[ "$LIFECYCLE_ONLY" == true ]]; then
              if [[ -n "$BASELINE" ]]; then scope=lifecycle; else scope=fresh; fi
            elif [[ -n "$BASELINE" ]]; then
              scope=true
            else
              scope=installer
            fi
            case "$ILEX_PRIVATE_FINGERPRINTS" in "$RUNNER_TEMP"/ilex-fingerprints.*) ;; *) exit 1 ;; esac
            python3 -B crates/ilex-e2e/src/encrypted/privacy.py "$RUNNER_TEMP/security-artifacts" --seal-export "$RUNNER_TEMP/qualification-evidence.seal" "$scope" "$ILEX_PRIVATE_FINGERPRINTS"
          else
            python3 -B crates/ilex-e2e/src/encrypted/privacy.py "$RUNNER_TEMP/security-artifacts" --seal-export "$RUNNER_TEMP/qualification-evidence.seal" false
          fi
          echo "scope=$scope" >> "$GITHUB_OUTPUT"

      - name: Remove private qualification fingerprints
        if: always() && env.ILEX_PRIVATE_FINGERPRINTS != ''
        run: |
          case "$ILEX_PRIVATE_FINGERPRINTS" in "$RUNNER_TEMP"/ilex-fingerprints.*) ;; *) exit 1 ;; esac
          for tier in encrypted-install encrypted-existing-space encrypted-interrupted encrypted-upgrade-rollback; do
            rm -f -- "$ILEX_PRIVATE_FINGERPRINTS/$tier.json"
          done
          rmdir -- "$ILEX_PRIVATE_FINGERPRINTS"

      - name: Keep security qualification evidence
        if: steps.qualification-scan.outcome == 'success' && !inputs.encrypted_lifecycle_only
        uses: ./.github/actions/upload-qualification-evidence
        with:
          name: security-evidence
          encrypted: ${{ steps.qualification-scan.outputs.scope }}

      - name: Keep encrypted installer public evidence
        if: steps.qualification-scan.outcome == 'success' && inputs.encrypted_install && !inputs.encrypted_lifecycle_only
        uses: ./.github/actions/upload-qualification-evidence
        with:
          name: encrypted-installer-evidence
          encrypted: ${{ steps.qualification-scan.outputs.scope }}

      - name: Keep sealed focused encrypted evidence
        if: steps.qualification-scan.outcome == 'success' && inputs.encrypted_lifecycle_only
        uses: ./.github/actions/upload-qualification-evidence
        with:
          name: encrypted-lifecycle-evidence
          encrypted: ${{ steps.qualification-scan.outputs.scope }}

      - name: e2e apps installation (opt-in)
        id: apps
        if: inputs.apps
        timeout-minutes: 60
        env:
          ILEX_IMAGE: ${{ steps.stage.outputs.image_id }}
        run: sg libvirt -c 'cargo ilexctl test apps::install -- --test-threads 1'

      - name: Apps qualification summary
        if: always()
        env:
          APPS_RESULT: ${{ steps.apps.outcome || 'skipped' }}
        run: |
          echo "Installed-system Flatpak qualification (apps input): $APPS_RESULT" >> "$GITHUB_STEP_SUMMARY"

      # Last step: the installer root's inventory row exists only when every
      # step above succeeded, and publish needs this whole job to have succeeded.
      # The other roots have their own jobs (other-roots).
      - name: Record the installer root's evidence
        id: roots
        if: ${{ !inputs.encrypted_install }}
        env:
          TAG: ${{ steps.composition.outputs.tag }}
          SNAPSHOT: ${{ steps.composition.outputs.snapshot }}
          CHANGED: ${{ steps.changed.outputs.changed || 'false' }}
          DIGEST: ${{ steps.stage.outputs.digest }}
          FINGERPRINT: ${{ steps.stage.outputs.fingerprint }}
          IMAGE_ID: ${{ steps.stage.outputs.image_id }}
        run: bash .github/root-evidence.sh

  # The upgrade tier on a runner of its own. Installing v1 to a disk takes ~14
  # minutes on a runner, most of the tier's time, so the v1-disk run installs
  # each new :generic.gnome ahead of time and this job restores that disk from the
  # Actions cache. Without one (say, a run that starts before the v1-disk run
  # of the last publish is done) it installs v1 itself, from its first minute.
  upgrade:
    needs: snapshot
    if: ${{ !inputs.v1_disk && !inputs.encrypted_install }}
    runs-on: ${{ vars.ILEX_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 120
    outputs:
      # The digest the upgrade tier tested; empty when there was nothing to
      # test (no :generic.gnome yet, or no candidate).
      tested: ${{ steps.candidate.outputs.digest }}
      # false: neither the installer tag nor legacy latest exists.
      exists: ${{ steps.from.outputs.exists }}
      # The v1 (installer tag or legacy latest) resolved before testing; '-' when no v1 exists.
      v1: ${{ steps.from.outputs.digest }}
      own: ${{ steps.from.outputs.own }}
    env:
      # The candidate, pulled by digest below and tagged like on the
      # build runner; set before it exists so `cargo ilexctl test` never builds one.
      ILEX_IMAGE: localhost/ilex:rechunked
    steps:
      - uses: actions/checkout@v7

      - name: Registry names (ghcr needs lowercase)
        id: from
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INSTALLER_TAG: ${{ needs.snapshot.outputs.installer }}
          SNAPSHOTS: ${{ needs.snapshot.outputs.compositions }}
          LEGACY_DIGEST: ${{ needs.snapshot.outputs.legacy }}
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ilex"
          echo "IMAGE_REPO=$repo" >> "$GITHUB_ENV"
          command -v skopeo >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y skopeo; }
          # Podman and skopeo share read authorization for public/private
          # packages. Only explicit manifest/name unknown means no v1;
          # denied/unauthorized and transport errors fail the lookup.
          podman login --username "$GITHUB_ACTOR" --password-stdin ghcr.io <<<"$REGISTRY_TOKEN"
          tag=$INSTALLER_TAG
          bash .github/publication-tag.sh "$tag"
          echo "INSTALLER_TAG=$tag" >> "$GITHUB_ENV"
          own=$(jq -er --arg tag "$tag" '.[$tag]' <<<"$SNAPSHOTS")
          bash .github/upgrade-from.sh "$repo" "$tag" "$own" "$LEGACY_DIGEST"

      # v1 installed to a disk by the v1-disk run that followed the publish of
      # v1 (see that job). vm-prep.sh hands it to bcvk; on a miss v1 is
      # installed here.
      - name: v1's disk from the cache
        if: steps.from.outputs.exists == 'true'
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/v1-disk
          key: ${{ steps.from.outputs.disk_key }}

      - name: apt's packages from the cache
        if: steps.from.outputs.exists == 'true'
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/apt-debs
          key: ${{ env.APT_DEBS }}
          restore-keys: ${{ env.APT_DEBS }}

      - uses: kunobi-ninja/kache-action@v1
        if: steps.from.outputs.exists == 'true'
        with:
          github-cache: "true"

      # The VM stack and a pull of v1, then v1's disk (from the cache, or
      # installed) booted once with ILEX_UPGRADE_PREPARE=1, so the test boots
      # v1 in seconds. Its consoles land in vm-logs.
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        if: steps.from.outputs.exists == 'true'
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: VM stack and v1's disk (background)
        if: steps.from.outputs.exists == 'true'
        env:
          ILEX_VM_LOG_DIR: ${{ runner.temp }}/vm-logs
          ILEX_V1_DISK: ${{ runner.temp }}/v1-disk
        run: |
          mkdir -p "$ILEX_VM_LOG_DIR" && chmod 1777 "$ILEX_VM_LOG_DIR"
          nohup bash .github/vm-prep.sh upgrade > /dev/null 2>&1 &

      # Until the build job's "Stage the candidate" step succeeds. If the build
      # job ends without it (nothing changed, or it failed), there is nothing
      # to test and the publish job won't run either.
      - name: Wait for the candidate
        id: candidate
        if: steps.from.outputs.exists == 'true'
        timeout-minutes: 60
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 100 per page and every page: with many roots the run lists far more
          # than the default 30 jobs, and `build` can fall on a later page.
          jobs="repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100"
          query='.jobs[] | select(.name == "build" or .name == "pipeline / build")
                 | "\(.status) \(([(.steps // [])[] | select(.name == "Stage the candidate") | .conclusion][0]) // "pending")"'
          # 30 s: this and every non-installer root's qualification gate poll the
          # run with the repository's shared token. An API error is not a verdict:
          # it is logged and the poll goes on (the step's timeout ends it).
          errors=0
          while :; do
            if state=$(gh api --paginate "$jobs" --jq "$query" 2>"$RUNNER_TEMP/jobs-error"); then
              errors=0
            else
              state=""
              errors=$((errors + 1))
              echo "jobs API request failed (${errors} in a row): $(head -c 300 "$RUNNER_TEMP/jobs-error" | tr '\n' ' ')"
              if [ "$errors" -eq 10 ]; then
                echo "::warning title=Upgrade tier: jobs API keeps failing::${errors} requests in a row failed while waiting for the installer build's staging step; still polling"
              fi
            fi
            case "$state" in
              *" success") break ;;
              "completed "*)
                echo "::notice::the build job ended without staging a candidate ($state): nothing to test"
                exit 0 ;;
            esac
            sleep 30
          done
          stage_tag=$(bash .github/candidate-tag.sh "$INSTALLER_TAG")
          digest=$(skopeo inspect --format '{{.Digest}}' "docker://$IMAGE_REPO:$stage_tag")
          echo "candidate: $IMAGE_REPO:$stage_tag -> $IMAGE_REPO@$digest"
          podman pull --quiet "$IMAGE_REPO@$digest"
          podman tag "$IMAGE_REPO@$digest" "$ILEX_IMAGE"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Wait for v1's disk
        if: steps.candidate.outputs.digest != ''
        timeout-minutes: 30
        run: |
          .github/vm-prep.sh wait vm-stack
          .github/vm-prep.sh wait v1-pull
          .github/vm-prep.sh wait upgrade-prepare

      - name: e2e tests (upgrade)
        id: e2e
        if: steps.candidate.outputs.digest != ''
        env:
          # The libvirt VM's consoles land here (the domain itself is removed
          # when the test ends); kept as an artifact on failure.
          ILEX_VM_LOG_DIR: ${{ runner.temp }}/vm-logs
        run: |
          trap 'if [ $? -ne 0 ]; then
                  sudo dmesg | grep -iE "apparmor|denied" | tail -40
                  sudo sh -c "tail -n 40 /var/log/libvirt/qemu/*.log" || true
                  sudo cp /var/log/libvirt/qemu/*.log "$ILEX_VM_LOG_DIR/" 2>/dev/null || true
                  sudo chmod -R a+r "$ILEX_VM_LOG_DIR" || true
                fi' EXIT
          sg libvirt -c "cargo ilexctl test upgrade::"

      - name: Keep VM logs
        if: failure() && steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: vm-logs
          path: ${{ runner.temp }}/vm-logs
          if-no-files-found: ignore

  # Main only: a manual run dispatched from another branch builds, stages and
  # tests, but never moves :generic.gnome. Signs the staged digest, the one both tiers
  # tested, then moves :generic.gnome and the date tag to it.
  publish:
    needs: [build, upgrade]
    if: >-
      needs.build.result == 'success' && needs.upgrade.result == 'success' &&
      needs.build.outputs.installer_changed == 'true' &&
      github.repository == 'Reidond/ilex' && inputs.main &&
      contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name)
    runs-on: ${{ vars.ILEX_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 30
    outputs:
      # A green overtaken run did not publish. Dependants need this signal,
      # not just needs.publish.result == success.
      published: ${{ steps.publication.outputs.published }}
      roots: ${{ steps.publication.outputs.roots }}
    permissions:
      contents: read
      packages: write
      # Starts the v1-disk run.
      actions: write
    steps:
      - uses: actions/checkout@v7

      - uses: kunobi-ninja/kache-action@ad7317540dcdd71c904f7a60a87b620a0c0e67ed # v1
        with:
          version: v2.1.1
          token: ""
          pr-comment: "false"
          github-cache: "true"

      - name: Build publisher without signing credentials
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          command -v skopeo >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y skopeo; }
          bash .github/build-publisher.sh
          podman login --username "$GITHUB_ACTOR" --password-stdin ghcr.io <<<"$REGISTRY_TOKEN"

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Publish and sign
        id: publication
        env:
          ROOTS: ${{ needs.build.outputs.roots }}
          ROOT_SCOPE: installer
          INSTALLER_TAG: ${{ needs.build.outputs.tag }}
          OWN: ${{ needs.upgrade.outputs.own }}
          TESTED: ${{ needs.upgrade.outputs.tested }}
          V1_EXISTS: ${{ needs.upgrade.outputs.exists }}
          V1_DIGEST: ${{ needs.upgrade.outputs.v1 }}
          GH_TOKEN: ${{ github.token }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          export IMAGE_REPO="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ilex"
          bash .github/publish-roots.sh

      # The next run's upgrade tier boots what was just published as its v1.
      # A failure here costs that run the install, nothing else.
      - name: Start the v1-disk run
        if: steps.publication.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f v1_disk=true ||
            echo "::warning::could not start the v1-disk run; the next upgrade tier installs v1 itself"

  # Every other root (`base`, a second desktop, ...) has a job chain of its own
  # in publish-root.yml: its build/changed/rechunk/stage/ephemeral job, then its
  # signing job, then its own layers. Calls run in parallel on separate runners
  # and never fail fast: a failed root turns the run red, but the installer
  # root's build, upgrade, publish, machines and installer-release (and every
  # other root) do not depend on it. Nothing here needs the signing key until
  # a call's publish job, and that needs that call's own build to have passed.
  other-roots:
    needs: snapshot
    if: >-
      !cancelled() && !inputs.v1_disk && !inputs.encrypted_install &&
      needs.snapshot.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        tag: ${{ fromJSON(needs.snapshot.outputs.others || '["base"]') }}
    permissions:
      contents: read
      packages: write
      # The call's qualification job reads this run's jobs.
      actions: read
    uses: ./.github/workflows/publish-root.yml
    with:
      tag: ${{ matrix.tag }}
      installer_tag: ${{ needs.snapshot.outputs.installer }}
      snapshots: ${{ needs.snapshot.outputs.compositions }}
      legacy: ${{ needs.snapshot.outputs.legacy }}
      fedora_bootc: ${{ needs.snapshot.outputs.fedora_bootc }}
      fedora_builder: ${{ needs.snapshot.outputs.fedora_builder }}
      main: ${{ inputs.main }}
      test: ${{ inputs.test }}
      apps: ${{ inputs.apps }}
      cosign_version: ${{ needs.snapshot.outputs.cosign_version }}
      bcvk_version: ${{ needs.snapshot.outputs.bcvk_version }}
      bcvk_sha256: ${{ needs.snapshot.outputs.bcvk_sha256 }}
      apt_debs: ${{ needs.snapshot.outputs.apt_debs }}
    secrets:
      COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
      COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}

  # One table of every root's outcome in the run summary, and an error
  # annotation for each root with a failed, timed-out or cancelled job. It gates
  # nothing: a red root already turns the run red through its own jobs, and no
  # job needs this one. Not for the encrypted qualification, where the roots'
  # jobs (and the upgrade tier) do not run.
  roots-report:
    needs: [snapshot, build, upgrade, publish, machines, other-roots]
    if: ${{ !cancelled() && !inputs.v1_disk && !inputs.encrypted_install && needs.snapshot.result == 'success' }}
    runs-on: ${{ vars.ILEX_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      # Only for .github/installer-qualification.jq, the gate's own decision.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: .github

      - name: Every root's build, qualification, publication and layers
        env:
          GH_TOKEN: ${{ github.token }}
          INSTALLER_TAG: ${{ needs.snapshot.outputs.installer }}
          OTHERS: ${{ needs.snapshot.outputs.others }}
        run: |
          raw=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" \
            --jq '.jobs[] | {name, status, conclusion, steps: [(.steps // [])[] | {name, conclusion, completed_at}]}' | jq -s -c .)
          jobs=$(jq -c '[.[] | {name, result: (.conclusion // .status)}]' <<<"$raw")
          # The installer root's qualification, decided by the very program the
          # gate runs (not from the two jobs' conclusions alone: a job carried
          # over from an earlier attempt qualifies nothing it did not test).
          qualification=$(jq -c -f .github/installer-qualification.jq <<<"$raw")
          verdict=$(jq -r .verdict <<<"$qualification")
          why=$(jq -r .why <<<"$qualification")
          # The caller job is named `pipeline` in publish.yml; the installer
          # root's jobs are `pipeline / <job>` and every other root's are
          # `pipeline / other-roots (<tag>) / <job>`. Missing names show `-`.
          # Qualification: the installer's own upgrade job, and for every other
          # root the gate's verdict on the installer's build and upgrade jobs
          # (what its `qualification` job decided from the same listing).
          report=$(jq -c --arg installer "$INSTALLER_TAG" --argjson others "$OTHERS" --arg verdict "$verdict" '
            def result($name): ([.[] | select(.name == $name) | .result] | first) // "-";
            def bad: . == "failure" or . == "timed_out" or . == "cancelled";
            . as $jobs
            | ($verdict == "true") as $met
            | [{tag: $installer, prefix: "pipeline / ", installer: true}] +
              [$others[] | {tag: ., prefix: "pipeline / other-roots (\(.)) / ", installer: false}]
            | map(. as $r
                | ($r.prefix) as $p
                | ($jobs | result($p + "build")) as $build
                | (if $r.installer then
                     ($jobs | result($p + "upgrade")) as $tier
                     | if $tier == "success" and $verdict == "false" then "success (installer NOT qualified, see below)" else $tier end
                   else ($jobs | result($p + "qualification")) as $gate
                        | if $gate == "success" then (if $met then "met" elif $verdict == "pending" then "pending" else "NOT met" end) else $gate end
                   end) as $qual
                | ($jobs | result($p + "publish")) as $publish
                | ($jobs | result($p + "machines")) as $machines
                | {tag: $r.tag, installer: $r.installer, build: $build, qual: $qual,
                   publish: (if $publish == "skipped" and $qual == "NOT met" then "skipped (not qualified)" else $publish end),
                   machines: (if $machines == "skipped" and $qual == "NOT met" then "skipped (not qualified)" else $machines end),
                   failed: [(if $r.installer then ["build", "upgrade", "publish", "machines"]
                             else ["build", "qualification", "publish", "machines"] end)[]
                            | . as $part | select($jobs | result($p + $part) | bad)]})
            | {met: $met, roots: .}' <<<"$jobs")
          {
            echo '### Roots'
            echo
            echo '| Root | Build and tests | Qualification | Publication | Layers |'
            echo '| --- | --- | --- | --- | --- |'
            jq -r '.roots[] | "| \(.tag) | \(.build) | \(.qual) | \(.publish) | \(.machines) |"' <<<"$report"
            echo
            echo 'Qualification: the installer root'"'"'s `upgrade` job; for every other root, whether the installer root'"'"'s `build` (security tier) and `upgrade` jobs both succeeded and the upgrade tier passed on this attempt'"'"'s candidate (a job carried over from an earlier attempt does not count), which its signing and its layers wait for.'
            echo
            case "$verdict" in true) label=met ;; false) label='NOT met' ;; *) label=pending ;; esac
            echo "Installer qualification: $label. $why."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$verdict" = false ]; then
            echo "::warning title=Installer qualification not met::$why. The other roots are not signed in this run"
          fi
          jq -r '.roots[] | select(.failed | length > 0) | "\(.tag)\t\(.installer)\t\(.failed | join(", "))"' <<<"$report" |
            while IFS=$'\t' read -r tag installer failed; do
              if [ "$installer" = true ]; then
                case ", $failed, " in
                  *", build, "* | *", upgrade, "*)
                    echo "::error title=Installer root $tag failed::failed jobs: $failed. The other roots built and tested independently, but without the installer root's qualification none of them is signed in this run" ;;
                  *)
                    echo "::error title=Installer root $tag failed::failed jobs: $failed. The other roots carried on" ;;
                esac
              else
                echo "::error title=Root $tag failed::failed jobs: $failed. The installer root and the other roots carried on"
              fi
            done
          jq -r '.roots[] | "\(.tag): build \(.build), qualification \(.qual), publication \(.publish), layers \(.machines)"' <<<"$report"

  # The exact tested/published generic base plus one squashed machine layer.
  # No rechunk and no machine candidate tag. A branch only builds and tests.
  # Only the installer root's layers: every other root's layers run in its own
  # publish-root.yml call, after that root's own publication.
  machines:
    needs: [snapshot, build, upgrade, publish]
    # !cancelled() permits the intentionally skipped publish job, but never a
    # failed base/test job or a failed publish. On main a changed base MUST have
    # been published.
    # No PR/fork event can reach code with registry or signing credentials.
    if: >-
      !cancelled() && !inputs.v1_disk && github.repository == 'Reidond/ilex' &&
      contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) &&
      needs.build.result == 'success' && needs.upgrade.result == 'success' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ${{ vars.ILEX_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # v1: token is used for release discovery/PR comments, not the cache API.
      # Pin both action code and binary version so neither needs a token input.
      # The job token still has packages:write; this is not a per-step sandbox.
      - uses: kunobi-ninja/kache-action@ad7317540dcdd71c904f7a60a87b620a0c0e67ed # v1
        with:
          version: v2.1.1
          token: ""
          pr-comment: "false"
          github-cache: "true"

      - name: Publications (validated compositions, parents and selections)
        run: cargo ilexctl info --publications > "$RUNNER_TEMP/publications"

      - name: Plan changed machine compositions (registry metadata only)
        id: plan
        env:
          ROOTS: ${{ needs.build.outputs.roots }}
          ROOT_TAG: ${{ needs.build.outputs.tag }}
          SNAPSHOTS: ${{ needs.snapshot.outputs.compositions }}
          PUBLISHED_ROOTS: ${{ needs.publish.outputs.roots || '[]' }}
          FORCE_TEST: ${{ inputs.test == true || inputs.apps == true }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export IMAGE_REPO="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ilex"
          echo "IMAGE_REPO=$IMAGE_REPO" >> "$GITHUB_ENV"
          command -v skopeo >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y skopeo; }
          podman login --username "$GITHUB_ACTOR" --password-stdin ghcr.io <<<"$REGISTRY_TOKEN"
          bash .github/plan-machines.sh

      - name: apt's packages from the cache
        if: steps.plan.outputs.build == 'true'
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/apt-debs
          key: ${{ env.APT_DEBS }}
          restore-keys: ${{ env.APT_DEBS }}

      - name: Build and test changed machine layers
        id: tested
        if: steps.plan.outputs.build == 'true'
        env:
          FORCE_TEST: ${{ inputs.test == true || inputs.apps == true }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/test-machines.sh

      - name: Build publisher without signing credentials
        if: steps.tested.outputs.changed == 'true'
        run: bash .github/build-publisher.sh

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        if: >-
          success() && inputs.main &&
          steps.tested.outputs.changed == 'true'
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      # Only this step receives the cosign key/password. Registry authorization
      # is the job's packages:write token; action inputs are not a sandbox.
      - name: Publish and sign tested machines (main only)
        if: >-
          success() && inputs.main &&
          steps.tested.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: bash .github/publish-machines.sh

  # Only in a run started with `v1_disk` (the publish job starts one after each
  # publish): the published :generic.gnome installed to a disk exactly the way the
  # upgrade tier installs its v1, and kept in the Actions cache under its
  # digest, so the next run's upgrade tier restores it instead of spending ~14
  # minutes installing v1. One disk (~5 GB) at a time: older ones are deleted.
  v1-disk:
    if: inputs.v1_disk && !inputs.encrypted_install
    runs-on: ${{ vars.ILEX_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 60
    permissions:
      contents: read
      # Deletes the superseded disks from the cache.
      actions: write
    env:
      # Set, so `cargo ilexctl test` builds nothing: preparing v1 needs no candidate.
      ILEX_IMAGE: localhost/ilex:rechunked
    steps:
      - uses: actions/checkout@v7

      - name: Which installer composition
        id: v1
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ilex"
          command -v skopeo >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y skopeo; }
          tag=$(cargo ilexctl info --installer)
          bash .github/publication-tag.sh "$tag"
          digest=$(bash .github/publish-head.sh digest "$repo:$tag")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "v1: $repo@$digest"
          echo "ILEX_UPGRADE_FROM=$repo@$digest" >> "$GITHUB_ENV"
          key=$(bash .github/v1-disk-key.sh "$digest")
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Already cached?
        id: cached
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/v1-disk
          key: ${{ steps.v1.outputs.key }}
          lookup-only: true

      - uses: kunobi-ninja/kache-action@v1
        if: steps.cached.outputs.cache-hit != 'true'
        with:
          github-cache: "true"

      - name: apt's packages from the cache
        id: debs
        if: steps.cached.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/apt-debs
          key: ${{ env.APT_DEBS }}
          restore-keys: ${{ env.APT_DEBS }}

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        if: steps.cached.outputs.cache-hit != 'true'
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Install v1 to a disk
        id: install
        if: steps.cached.outputs.cache-hit != 'true'
        run: |
          bash .github/vm-prep.sh upgrade || true
          for part in vm-stack v1-pull upgrade-prepare; do .github/vm-prep.sh wait "$part"; done
          echo "debs=$APT_DEBS$(cat "$RUNNER_TEMP/apt-debs.sum")" >> "$GITHUB_OUTPUT"
          if [ "$(cat "$RUNNER_TEMP/upgrade-prepare.status")" != 0 ]; then
            echo "::error::installing v1 failed"; exit 1
          fi
          .github/vm-prep.sh save-disk "$RUNNER_TEMP/v1-disk"

      - name: Keep apt's packages in the cache
        if: steps.install.outputs.debs != '' && steps.install.outputs.debs != steps.debs.outputs.cache-matched-key
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/apt-debs
          key: ${{ steps.install.outputs.debs }}

      - name: Keep it in the cache
        if: steps.cached.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/v1-disk
          key: ${{ steps.v1.outputs.key }}

      - name: Delete superseded disks
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ steps.v1.outputs.key }}
        run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --key v1-disk- --limit 100 --json id,key \
              --jq '.[] | select(.key != env.KEY) | .id' |
            while read -r id; do gh cache delete --repo "$GITHUB_REPOSITORY" "$id"; done
          gh cache list --repo "$GITHUB_REPOSITORY" --key v1-disk-

  # Is a new installer ISO due? Its own job, next to the others: the ISO carries
  # no ilex image, so it needn't wait for the publish, and `installer/` can
  # change alone. Reads the latest installer release.
  installer-due:
    if: ${{ !inputs.v1_disk && (inputs.main || inputs.iso) && (!inputs.encrypted_install || inputs.iso) }}
    runs-on: ${{ vars.ILEX_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 15
    outputs:
      iso_due: ${{ steps.isodue.outputs.iso_due }}
    steps:
      - uses: actions/checkout@v7
      - name: Is a new installer ISO due?
        id: isodue
        run: cargo ilexctl iso --due
        env:
          GH_TOKEN: ${{ github.token }}

  # The network installer ISO, built when `cargo ilexctl iso --due` says so (see
  # the top of this file) or on a manual run with `iso` checked. It carries no
  # ilex image, so it doesn't depend on what the publish job published. On main
  # it becomes an artifact first. installer-release waits for publication,
  # verifies the signed target and installs this exact ISO before releasing.
  # Branch runs build the artifact only: iso:: would install the published
  # target, not the branch's image. Construction stays parallel with image CI.
  iso:
    needs: installer-due
    if: >-
      !inputs.v1_disk && (inputs.iso ||
      (inputs.main && needs.installer-due.outputs.iso_due == 'true'))
    runs-on: ${{ vars.ILEX_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 60
    outputs:
      tag: ${{ steps.composition.outputs.tag }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Resolve installer composition before the rootful build
        id: composition
        run: |
          # The container builds as root with /src bind-mounted. Keep host
          # Cargo artifacts separate and never run host Cargo after that build.
          tag=$(CARGO_TARGET_DIR="$RUNNER_TEMP/installer-info-target" cargo ilexctl info --installer)
          bash .github/publication-tag.sh "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Disk
        run: df -h / /mnt

      # osbuild (inside image-builder) runs its stages in a bubblewrap sandbox
      # and bind-mounts container storage there. Ubuntu 24.04+ confines
      # bubblewrap with AppArmor: the `bwrap-userns-restrict` profile attaches
      # to any /usr/bin/bwrap by path, even inside our unconfined container,
      # and its `unpriv_bwrap` child denies setuid, chown and the sys_admin
      # the mount needs ("mount: /run/osbuild/containers/storage: permission
      # denied"). On the throwaway runner, unload that profile and lift the
      # user-namespace restriction; if the build still fails, print the
      # kernel's AppArmor denials. The job runs on the host and starts its
      # own rootful, privileged Fedora 45 container with podman.
      # Container storage, image-builder's cache, the ISO and TMPDIR live on
      # the runner's big disk under /mnt, off overlayfs (podman can't nest
      # overlay on overlay). `generic-iso` needs image-builder 89, which Fedora
      # 45 provides in updates.
      #
      # The installer's base (Anaconda, the initramfs) is rebuilt every time on
      # purpose: the weekly build exists to pick up Fedora and Anaconda fixes,
      # which a cached base would pin.
      - name: Build the installer ISO
        run: |
          if [ -e /etc/apparmor.d/bwrap-userns-restrict ]; then
            sudo apparmor_parser -R /etc/apparmor.d/bwrap-userns-restrict
          fi
          for knob in kernel.apparmor_restrict_unprivileged_userns \
                      kernel.apparmor_restrict_unprivileged_unconfined; do
            if sudo sysctl -n "$knob" >/dev/null 2>&1; then sudo sysctl -w "$knob=0"; fi
          done
          sudo aa-status 2>/dev/null | grep -i bwrap || echo "no bwrap AppArmor profile loaded"
          trap 'if [ $? -ne 0 ]; then sudo dmesg | grep -iE "apparmor|denied" | tail -40; fi' EXIT
          sudo mkdir -p /mnt/ilex/containers /mnt/ilex/image-builder /mnt/ilex/state/tmp
          sudo podman run --rm --privileged --security-opt label=disable \
              --security-opt apparmor=unconfined --security-opt seccomp=unconfined \
              -v "$PWD:/src" -w /src \
              -v /mnt/ilex/containers:/var/lib/containers \
              -v /mnt/ilex/image-builder:/var/cache/image-builder \
              -v /mnt/ilex/state:/mnt/ilex-state \
              -e ILEX_STATE_DIR=/mnt/ilex-state -e TMPDIR=/mnt/ilex-state/tmp \
              quay.io/fedora/fedora:45 bash -euxc '
                dnf -y install git cargo gcc podman skopeo
                dnf -y install image-builder
                image-builder version
                git config --global --add safe.directory /src
                cargo ilexctl iso --output-dir /mnt/ilex-state/iso
              '
          ls -l /mnt/ilex/state/iso/

      # A branch run stops here: the ISO to inspect, no installation/release.
      - name: What main would release
        if: ${{ !inputs.main }}
        run: |
          size=$(stat -c %s /mnt/ilex/state/iso/ilex-installer.iso)
          echo "ISO: $size bytes ($((size / 1048576)) MiB; a release asset has to be under 2048 MiB)"
          cat /mnt/ilex/state/iso/ilex-installer.iso.sha256
          tag="installer-$(date -u +%Y%m%d)"
          echo "A run on main would create the release $tag:"
          echo "  https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/ilex-installer.iso"
          echo "and make this link point at it:"
          echo "  https://github.com/$GITHUB_REPOSITORY/releases/latest/download/ilex-installer.iso"
          echo "--- release notes:"; cat /mnt/ilex/state/iso/release-notes.md

      - name: Keep the ISO (not a release)
        uses: actions/upload-artifact@v4
        with:
          name: installer-iso
          path: |
            /mnt/ilex/state/iso/ilex-installer.iso
            /mnt/ilex/state/iso/ilex-installer.iso.sha256
            /mnt/ilex/state/iso/compositions.json
            /mnt/ilex/state/iso/release-notes.md
          compression-level: 0
          retention-days: 3

  # Only due/forced ISOs incur this ~15 minute KVM installation. !cancelled()
  # permits publish's intentional unchanged skip, but not a failed dependency
  # or a green guard skip (published=false). First main waits for its new tag.
  installer-release:
    needs: [iso, build, upgrade, publish]
    if: >-
      !cancelled() && github.repository == 'Reidond/ilex' && inputs.main &&
      contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) &&
      needs.iso.result == 'success' && needs.build.result == 'success' && needs.upgrade.result == 'success' &&
      ((needs.publish.result == 'success' && needs.publish.outputs.published == 'true') ||
       (needs.publish.result == 'skipped' && needs.build.outputs.installer_changed == 'false'))
    runs-on: ${{ vars.ILEX_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 240
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v7

      - name: Installer test paths
        run: |
          {
            echo "ISO_DIR=$RUNNER_TEMP/installer-iso"
            echo "ILEX_STATE_DIR=$RUNNER_TEMP/installer-test-state"
            echo "ILEX_ARTIFACTS=$RUNNER_TEMP/installer-test-artifacts"
          } >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          name: installer-iso
          path: ${{ env.ISO_DIR }}

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Authenticate installer registry reads
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          command -v skopeo >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y skopeo; }
          # Same private auth file for podman/skopeo and cosign's Docker keychain.
          export DOCKER_CONFIG="$RUNNER_TEMP/installer-auth"
          export REGISTRY_AUTH_FILE="$DOCKER_CONFIG/config.json"
          mkdir -m 700 "$DOCKER_CONFIG"
          podman login --authfile "$REGISTRY_AUTH_FILE" --username "$GITHUB_ACTOR" --password-stdin ghcr.io <<<"$REGISTRY_TOKEN"
          {
            echo "DOCKER_CONFIG=$DOCKER_CONFIG"
            echo "REGISTRY_AUTH_FILE=$REGISTRY_AUTH_FILE"
            echo "IMAGE_REPO=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ilex"
          } >> "$GITHUB_ENV"

      - name: Verify the installer's published target
        id: target
        env:
          INSTALLER_TAG: ${{ needs.iso.outputs.tag }}
          INSTALLER_SNAPSHOT: ${{ needs.publish.outputs.published == 'true' && needs.build.outputs.digest || needs.build.outputs.snapshot }}
        run: bash .github/installer-target.sh

      - name: apt's packages from the cache
        if: steps.target.outputs.available == 'true'
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/apt-debs
          key: ${{ env.APT_DEBS }}
          restore-keys: ${{ env.APT_DEBS }}

      - name: Prepare the installer test's VM stack
        if: steps.target.outputs.available == 'true'
        run: |
          df -h / /mnt
          test -c /dev/kvm
          nohup bash .github/vm-prep.sh ephemeral > /dev/null 2>&1 &

      - name: Install and boot this ISO
        id: install
        if: steps.target.outputs.available == 'true'
        env:
          ILEX_ISO: ${{ env.ISO_DIR }}/ilex-installer.iso
          ILEX_ISO_TARGET: ${{ steps.target.outputs.target }}
          ILEX_ISO_DIGEST: ${{ steps.target.outputs.digest }}
          # iso:: needs no locally built ilex container. This explicit reference
          # stops ilexctl from building its default image before the ISO tier.
          ILEX_IMAGE: ${{ steps.target.outputs.target }}
        run: |
          (cd "$ISO_DIR" && sha256sum --check ilex-installer.iso.sha256)
          bash .github/vm-prep.sh wait vm-stack
          sg libvirt -c 'cargo ilexctl test iso::'

      - name: Keep installer test evidence
        if: ${{ !cancelled() && steps.install.outcome != 'skipped' && steps.install.outcome != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: installer-test-evidence
          path: ${{ env.ILEX_ARTIFACTS }}
          if-no-files-found: ignore
          retention-days: 3

      - name: Select and verify the published rollback baseline
        id: encrypted-baseline
        if: success() && steps.install.outcome == 'success'
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          INSTALLER_TAG: ${{ needs.iso.outputs.tag }}
          INSTALLER_BASELINE_SNAPSHOT: ${{ needs.build.outputs.snapshot }}
          INSTALLER_BASELINE_TARGET: ${{ steps.target.outputs.digest }}
          ILEX_ENCRYPTED_UPGRADE_FROM: ${{ inputs.encrypted_upgrade_from || vars.ILEX_ENCRYPTED_UPGRADE_FROM }}
          ILEX_ARTIFACTS: ${{ runner.temp }}/security-artifacts
        run: bash .github/encrypted-baseline.sh

      - name: Qualify encrypted release installation and rollback
        id: encrypted-release
        if: success() && steps.install.outcome == 'success'
        timeout-minutes: 220
        env:
          ILEX_ISO: ${{ env.ISO_DIR }}/ilex-installer.iso
          ILEX_IMAGE: ${{ env.IMAGE_REPO }}@${{ steps.target.outputs.digest }}
          ILEX_ENCRYPTED_UPGRADE_FROM: ${{ steps.encrypted-baseline.outputs.reference }}
          ILEX_ARTIFACTS: ${{ runner.temp }}/security-artifacts
          ILEX_SECURITY_MEMORY: 6G
        run: |
          set -euo pipefail
          (cd "$ISO_DIR" && sha256sum --check ilex-installer.iso.sha256)
          podman pull --quiet "$ILEX_IMAGE"
          export ILEX_PRIVATE_FINGERPRINTS
          ILEX_PRIVATE_FINGERPRINTS=$(mktemp -d "$RUNNER_TEMP/ilex-fingerprints.XXXXXXXX")
          trap 'rm -f -- "$ILEX_PRIVATE_FINGERPRINTS/encrypted-install.json" "$ILEX_PRIVATE_FINGERPRINTS/encrypted-upgrade-rollback.json"; rmdir -- "$ILEX_PRIVATE_FINGERPRINTS"' EXIT
          bash .github/security-tier.sh
          ILEX_ENCRYPTED_PUBLISHED_INSTALL=1 timeout --signal=TERM --kill-after=30s 85m \
            cargo ilexctl test security::encrypted_install -- --exact --test-threads 1
          scope=fresh
          if [[ -n "$ILEX_ENCRYPTED_UPGRADE_FROM" ]]; then
            bash .github/encrypted-lifecycle.sh
            scope=release
          fi
          python3 - "$ILEX_ARTIFACTS" "${ILEX_IMAGE##*@}" "$ISO_DIR/ilex-installer.iso.sha256" "$ILEX_ENCRYPTED_UPGRADE_FROM" <<'PY'
          import json, pathlib, sys
          evidence = pathlib.Path(sys.argv[1])
          fresh = evidence / 'encrypted-install'
          install = json.loads((fresh / 'candidate.json').read_text())
          assert install['published_source'] and install['digest'] == sys.argv[2], 'fresh encrypted install did not use the published digest'
          expected = pathlib.Path(sys.argv[3]).read_text().split()[0]
          assert (fresh / 'iso-sha256.txt').read_text().split()[0] == expected, 'installer hash differs from fresh-install ISO'
          if sys.argv[4]:
              lifecycle = evidence / 'encrypted-upgrade-rollback'
              inputs = json.loads((lifecycle / 'input-images.json').read_text())
              assert inputs['baseline']['manifest_digest'] == sys.argv[4].split('@')[1], 'pinned digest differs from tested baseline'
              assert inputs['update']['manifest_digest'] == sys.argv[2], 'published digest differs from tested update'
              assert (lifecycle / 'iso-sha256.txt').read_text().split()[0] == expected, 'installer hash differs from lifecycle ISO'
          PY
          python3 -B crates/ilex-e2e/src/encrypted/privacy.py "$ILEX_ARTIFACTS" --seal-export "$RUNNER_TEMP/qualification-evidence.seal" "$scope" "$ILEX_PRIVATE_FINGERPRINTS"
          echo "scope=$scope" >> "$GITHUB_OUTPUT"

      - name: Keep sealed release lifecycle evidence
        if: steps.encrypted-release.outcome == 'success'
        uses: ./.github/actions/upload-qualification-evidence
        with:
          name: encrypted-release-lifecycle-evidence
          encrypted: ${{ steps.encrypted-release.outputs.scope }}

      - name: Publish the release
        if: success() && steps.target.outputs.available == 'true' && steps.install.outcome == 'success' && steps.encrypted-release.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          INSTALLER_TAG: ${{ needs.iso.outputs.tag }}
          VERIFIED_DIGEST: ${{ steps.target.outputs.digest }}
          INSTALL_RESULT: ${{ steps.install.outcome }}
        run: bash .github/release-installer.sh
