# Build, test, publish and sign the ilex image; then build the installer ISO.
#
# Runs on every merge to main, nightly at 03:00 UTC (the base image floats, so
# the nightly picks up its updates) and on demand. It publishes only when the
# image content changed (`cargo xtask changed`) and the e2e tests pass.
#
# One-time repository setup (secrets, public ghcr packages) is in CLAUDE.md.
name: publish

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  CARGO_TERM_COLOR: always
  # cosign v2 on purpose: bootc / containers-image verify the legacy `.sig`
  # tag format, which cosign v3 no longer writes by default.
  COSIGN_VERSION: v2.6.5
  BCVK_VERSION: v0.22.0
  BCVK_SHA256: eb72198c0d36fab75bfcadbb6794a87afa6f496a4da6b1b34d27728243fa6474

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      changed: ${{ steps.changed.outputs.changed }}
      digest: ${{ steps.publish.outputs.digest }}
    env:
      # `xtask build --tag candidate` tags the image localhost/ilex:candidate.
      ILEX_IMAGE: localhost/ilex:candidate
    steps:
      - uses: actions/checkout@v7

      - name: Registry names (ghcr needs lowercase)
        run: |
          echo "IMAGE_REPO=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ilex" >> "$GITHUB_ENV"
          echo "ILEX_UPGRADE_FROM=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ilex:latest" >> "$GITHUB_ENV"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h /

      - name: KVM, virt stack, bcvk
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils virtiofsd libvirt-daemon-system skopeo
          curl -fsSL -o "$RUNNER_TEMP/bcvk.tar.gz" \
            "https://github.com/bootc-dev/bcvk/releases/download/${BCVK_VERSION}/bcvk-x86_64-unknown-linux-gnu.tar.gz"
          echo "${BCVK_SHA256}  $RUNNER_TEMP/bcvk.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/bcvk.tar.gz" -C "$RUNNER_TEMP"
          sudo install -m 0755 "$RUNNER_TEMP/bcvk-x86_64-unknown-linux-gnu" /usr/local/bin/bcvk
          bcvk --version

      - name: Install cosign (v2)
        uses: sigstore/cosign-installer@v4.1.3
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - uses: kunobi-ninja/kache-action@v1
        with:
          github-cache: "true"

      - name: Build the candidate image
        run: cargo xtask build --tag candidate

      - name: Rechunk (reproducible layers) and fingerprint
        run: cargo xtask rechunk candidate

      - name: Compare with the published image
        id: changed
        run: cargo xtask changed "$IMAGE_REPO:latest" --image candidate
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The very first run has no published :latest, so there is nothing to
      # upgrade from and the upgrade tier is skipped.
      - name: e2e tests
        if: steps.changed.outputs.changed == 'true'
        run: |
          cargo xtask test ephemeral:: ${{ steps.changed.outputs.exists == 'true' && 'upgrade::' || '' }}

      - name: Publish and sign
        id: publish
        if: steps.changed.outputs.changed == 'true'
        run: cargo xtask publish candidate
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}

  # Runs only after a successful publish, from the digest just published. A
  # failure here never unpublishes the image.
  iso:
    needs: publish
    if: needs.publish.result == 'success' && needs.publish.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: quay.io/fedora/fedora:45
      options: --privileged
      # Keep container storage, image-builder's cache and the ISO on the
      # runner's big temporary disk, and off the container's overlay
      # filesystem (podman can't nest overlay on overlay).
      volumes:
        - /mnt/ilex/containers:/var/lib/containers
        - /mnt/ilex/image-builder:/var/cache/image-builder
        - /mnt/ilex/state:/mnt/ilex-state
    env:
      ILEX_STATE_DIR: /mnt/ilex-state
      # buildah stages build contexts under $TMPDIR; on the container's own
      # overlayfs that fails ("overlay over build context").
      TMPDIR: /mnt/ilex-state/tmp
    steps:
      # The `generic-iso` image type (Anaconda inside the installer container,
      # kickstart from the container) needs image-builder 89; Fedora 45 only has
      # 87 in its stable repo until 89 leaves updates-testing.
      - name: Tooling
        run: |
          mkdir -p "$TMPDIR"
          dnf -y install git cargo gcc podman skopeo
          dnf -y install --enablerepo=updates-testing image-builder
          image-builder version
      - uses: actions/checkout@v7
      - name: Build and push the installer ISO
        run: cargo xtask iso "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ilex@${DIGEST}"
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
