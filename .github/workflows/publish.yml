# Route the exact Git ref before acquiring the concurrency group.
name: publish

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      iso:
        description: Build the installer ISO even if it isn't due (on main it is released; from a branch it is kept as an artifact)
        type: boolean
        default: false
      iso_next:
        description: Only build the next installer's live ISO and boot-test it (kept as an artifact, never released; the image pipeline is skipped)
        type: boolean
        default: false
      test:
        description: Run the e2e tests even if the image is unchanged (to check CI changes from a branch; only main publishes)
        type: boolean
        default: false
      apps:
        description: Run the opt-in installed-system Flatpak qualification (downloads from Flathub)
        type: boolean
        default: false
      v1_disk:
        description: Only install the published installer composition to a disk for the upgrade tier's cache (the publish job starts this after each publish)
        type: boolean
        default: false
      encrypted_install:
        description: Qualify encrypted installation, recovery, privacy, upgrade and rollback (6 GiB)
        type: boolean
        default: false
      encrypted_upgrade_from:
        description: Optional signed rollback digest (then repository variable, then published installer history)
        type: string
      encrypted_update_kernel:
        description: Optional exact Fedora kernel for the disposable encrypted CI update image
        type: string
      encrypted_lifecycle_only:
        description: Run the encrypted lifecycle by itself for a focused qualification
        type: boolean
        default: false

permissions: {}

jobs:
  route:
    runs-on: ${{ vars.ILEX_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 2
    outputs:
      main: ${{ steps.ref.outputs.main }}
      group: ${{ steps.ref.outputs.group }}
      sign: ${{ steps.ref.outputs.sign }}
    steps:
      - name: Route the exact Git ref
        id: ref
        shell: bash
        env:
          V1_DISK: ${{ inputs.v1_disk || false }}
          ISO_NEXT: ${{ inputs.iso_next || false }}
        run: |
          main=false
          if [ "$GITHUB_REF" = refs/heads/main ]; then main=true; fi
          hash=$(printf '%s' "$GITHUB_REF" | sha256sum)
          # Only a run that can sign gets the signing secrets: a push or
          # nightly on main, or a manual run of main that is neither of the
          # two key-less runs below.
          sign=false
          if [ "$V1_DISK" = true ]; then
            group="v1-disk-${hash%% *}"
            if [ "$main" = true ]; then group=v1-disk-refs/heads/main; fi
          elif [ "$ISO_NEXT" = true ]; then
            # The next installer's ISO builds and boots in a group of its own,
            # on main too: it must neither wait for nor replace a real publish.
            group="iso-next-${hash%% *}"
          elif [ "$main" = true ]; then
            group=publish
            sign=true
          else
            group="publish-${hash%% *}"
          fi
          printf 'main=%s\ngroup=%s\nsign=%s\n' "$main" "$group" "$sign" >> "$GITHUB_OUTPUT"
          echo "Ref $GITHUB_REF uses concurrency group $group (signing secrets: $sign)"

  pipeline:
    needs: route
    concurrency:
      group: ${{ needs.route.outputs.group }}
      cancel-in-progress: ${{ inputs.v1_disk == true }}
    permissions:
      contents: write
      packages: write
      actions: write
    uses: ./.github/workflows/publish-pipeline.yml
    with:
      # An iso_next run is never a main run: it publishes and releases nothing.
      main: ${{ needs.route.outputs.main == 'true' && !inputs.iso_next }}
      iso: ${{ inputs.iso || false }}
      iso_next: ${{ inputs.iso_next || false }}
      test: ${{ inputs.test || false }}
      apps: ${{ inputs.apps || false }}
      v1_disk: ${{ inputs.v1_disk || false }}
      encrypted_install: ${{ inputs.encrypted_install || false }}
      encrypted_upgrade_from: ${{ inputs.encrypted_upgrade_from || '' }}
      encrypted_update_kernel: ${{ inputs.encrypted_update_kernel || '' }}
      encrypted_lifecycle_only: ${{ inputs.encrypted_lifecycle_only || false }}
    secrets:
      COSIGN_PRIVATE_KEY: ${{ needs.route.outputs.sign == 'true' && secrets.COSIGN_PRIVATE_KEY || '' }}
      COSIGN_PASSWORD: ${{ needs.route.outputs.sign == 'true' && secrets.COSIGN_PASSWORD || '' }}
