# This PC, named after its motherboard: MSI MEG X570 UNIFY. `ms-7c35` is the
# board's model number, lowercased: the DMI product_name is "MS-7C35" and
# board_name is "MEG X570 UNIFY (MS-7C35)".
# Ryzen 9 5900X (12 cores, 24 threads), 64 GiB, Radeon RX 9070 XT
# (PCI 1002:7550), 2 TB NVMe, AOC U27G3X (27 inches, 3840x2160 at 160 Hz;
# mutter scales it to 150% by itself).
#
# The Radeon needs nothing here: the kernel driver, amd-gpu-firmware and Mesa
# (radeonsi, RADV) are in every ilex image. No kernel argument is needed.
name = "ms-7c35"
description = "MSI MEG X570 UNIFY (MS-7C35): Radeon graphics, games, Steam from Flathub"
# Installer identity, read from the same SMBIOS tables with Windows CIM on
# 2026-11-15. Either complete pair is sufficient; Linux whitespace is stripped.
[[match]]
sys_vendor = "Micro-Star International Co., Ltd."
product_name = "MS-7C35"

[[match]]
board_vendor = "Micro-Star International Co., Ltd."
board_name = "MEG X570 UNIFY (MS-7C35)"

[packages]
# Steam itself is a Flatpak the person installs; it is not in the image.
# steam-devices: udev rules so Steam (also as a Flatpak) can use controllers.
# gamemode: while a game requests it, performance governor, split-lock
# mitigation off where supported, screensaver inhibition, and default
# best-effort I/O clients tuned to priority 0. Helpers need gamemode membership.
# gamescope: host compositor to wrap all of Flatpak Steam or native programs.
# mangohud: host overlay for native programs and gamescope's mangoapp overlay.
# Per-game use inside Flatpak Steam needs matching VulkanLayer extensions.
install = ["steam-devices", "gamemode", "gamescope", "mangohud"]
