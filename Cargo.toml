[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
ilex-tooling-core = { path = "crates/ilex-tooling-core" }
ilex-tooling-qmp = { path = "crates/ilex-tooling-qmp" }
ilex-tooling-linux = { path = "crates/ilex-tooling-linux" }
ilex-tooling-windows = { path = "crates/ilex-tooling-windows" }
ilex-devkit = { path = "crates/ilex-devkit" }
ilex-installer-model = { path = "crates/ilex-installer-model" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libtest-mimic = "0.8"

[profile.release]
lto = "thin"
strip = true

# Native disk transfers hash multi-GiB images in the dev profile.
[profile.dev.package."*"]
opt-level = 3
