[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
ilex-devkit = { path = "crates/ilex-devkit" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libtest-mimic = "0.8"

[profile.release]
lto = "thin"
strip = true

# `cargo xtask` runs a dev build, and `xtask vm --gui` moves a 4K screen per
# frame through the display bridge (ilex-devkit) and ilex-viewer: unoptimized,
# that managed 6 frames/s. Dependencies compile once, so optimize them too.
[profile.dev.package.ilex-devkit]
opt-level = 3

[profile.dev.package.ilex-viewer]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3
